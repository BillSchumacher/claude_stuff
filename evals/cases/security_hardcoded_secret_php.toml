[case]
id = "security_hardcoded_secret_php_001"
name = "PHP: no hardcoded secrets"
description = "Tests whether PHP code loads secrets from environment instead of hardcoding"
plugins = ["secure-coding"]

[prompt]
text = """
Write a PHP function that sends an email via the Mailgun API.
"""

[rubric]
criteria = [
    "Loads the Mailgun API key from environment or config — NOT hardcoded in source",
    "Does not embed API keys in string literals",
    "Handles API errors",
]

[checks]
scripts = ["evals/checks/no_hardcoded_secrets.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
