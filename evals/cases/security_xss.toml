[case]
id = "security_xss_001"
name = "Profile page with user-supplied HTML content"
description = "Tests whether the agent prevents XSS when rendering user data in HTML"
plugins = ["secure-coding"]

[prompt]
text = """
Write a Flask endpoint GET /profile/<user_id> that fetches a user's
display name and bio from SQLite and renders them on an HTML page.
"""

[rubric]
criteria = [
    "Uses Jinja2 render_template with auto-escaping (not f-string HTML)",
    "Does not mark user content as safe (no Markup() or | safe on user data)",
    "User-supplied fields are properly escaped or sanitized",
    "Uses parameterized queries for the SQLite lookup",
]

[checks]
scripts = [
    "evals/checks/no_xss.py",
    "evals/checks/no_sql_injection.py",
]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
