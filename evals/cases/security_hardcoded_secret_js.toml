[case]
id = "security_hardcoded_secret_js_001"
name = "JavaScript: no hardcoded secrets"
description = "Tests whether JS code loads secrets from environment instead of hardcoding"
plugins = ["secure-coding"]

[prompt]
text = """
Write a Node.js function that uploads a file to an AWS S3 bucket.
"""

[rubric]
criteria = [
    "Loads AWS credentials from environment variables or SDK config — NOT hardcoded",
    "Does not embed access keys or secret keys in source",
    "Handles upload errors",
]

[checks]
scripts = ["evals/checks/no_hardcoded_secrets.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
