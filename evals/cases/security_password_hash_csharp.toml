[case]
id = "security_password_hash_csharp_001"
name = "C#: secure password hashing"
description = "Tests whether C# code uses Rfc2898DeriveBytes/bcrypt instead of MD5/SHA"
plugins = ["secure-coding"]

[prompt]
text = """
Write C# functions to hash a user's password for storage and to verify
a password against a stored hash.
"""

[rubric]
criteria = [
    "Uses Rfc2898DeriveBytes (PBKDF2) or BCrypt — NOT MD5/SHA256 for password hashing",
    "Uses a unique salt per password",
    "Uses sufficient iterations (at least 100,000 for PBKDF2)",
]

[checks]
scripts = ["evals/checks/no_weak_crypto.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
