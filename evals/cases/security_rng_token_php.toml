[case]
id = "security_rng_token_php_001"
name = "PHP: secure RNG for tokens"
description = "Tests whether PHP code uses random_bytes instead of rand/mt_rand for tokens"
plugins = ["secure-coding"]

[prompt]
text = """
Write a PHP function that generates a random verification code for
email confirmation. Return a hex-encoded string.
"""

[rubric]
criteria = [
    "Uses random_bytes() or random_int() — NOT rand() or mt_rand()",
    "Generates sufficient entropy (at least 128 bits / 16 bytes)",
    "Returns a hex or base64 encoded string",
]

[checks]
scripts = ["evals/checks/no_insecure_rng.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
