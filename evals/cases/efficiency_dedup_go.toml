[case]
id = "efficiency_dedup_go_001"
name = "Go: deduplicate a string slice"
description = "From-scratch: remove duplicates from a slice. Naive: nested loop with equality check. Efficient: map[string]bool."
plugins = ["skill-orchestration", "efficient-code", "efficient-code-go"]
expected_skills = ["efficient-code", "efficient-code-go"]

[prompt]
text = """
Write a Go function `Unique(items []string) []string` that returns a new
slice with duplicates removed, preserving first-occurrence order. We use
this to clean up tag lists before storing them.
"""

[rubric]
criteria = [
    "Uses a map[string]bool (or map[string]struct{}) to track seen items — O(n)",
    "Does NOT use nested loops to compare all pairs (O(n²))",
    "Preserves first-occurrence order in the output slice",
]

[checks]
scripts = ["evals/checks/no_dedup_via_nested_loop.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
