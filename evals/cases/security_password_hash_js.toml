[case]
id = "security_password_hash_js_001"
name = "JavaScript: secure password hashing"
description = "Tests whether JS code uses bcrypt instead of SHA for passwords"
plugins = ["secure-coding"]

[prompt]
text = """
Write Node.js functions to hash a user's password for storage and
to verify a password against a stored hash.
"""

[rubric]
criteria = [
    "Uses bcrypt or argon2 — NOT crypto.createHash('sha256') for password hashing",
    "Uses a unique salt per password",
    "Verify function uses constant-time comparison (built into bcrypt.compare)",
]

[checks]
scripts = ["evals/checks/no_weak_crypto.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
