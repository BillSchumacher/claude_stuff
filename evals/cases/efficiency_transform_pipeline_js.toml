[prompt]
text = """
Given an array of user objects, return the email addresses of active users whose accounts are older than 30 days. Users have {email, isActive, createdAt} shape.
"""

[rubric]
criteria = ['Uses a single pass (reduce, for loop, or chained lazy iteration) — NOT multiple .filter().map().filter() creating intermediate arrays for each step', 'Returns correct email list']

