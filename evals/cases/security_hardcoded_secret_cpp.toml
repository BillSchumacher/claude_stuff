[case]
id = "security_hardcoded_secret_cpp_001"
name = "C++: no hardcoded secrets"
description = "Tests whether C++ code loads secrets from environment instead of hardcoding"
plugins = ["secure-coding"]

[prompt]
text = """
Write a C++ function that sends metrics to a Datadog API endpoint using
libcurl.
"""

[rubric]
criteria = [
    "Loads the API key from environment variable — NOT hardcoded in source",
    "Does not embed API keys in string literals",
    "Handles HTTP errors from the API call",
]

[checks]
scripts = ["evals/checks/no_hardcoded_secrets.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
