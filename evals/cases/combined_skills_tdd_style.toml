[case]
id = "combined_skills_001"
name = "All skills: user registration endpoint"
description = "A realistic task that should trigger multiple skills: dev-workflow (TDD), python-style (type hints), secure-coding (password hashing, input validation), api-design (error responses), observability (logging), acceptance-criteria (requirements), efficient-code (data structures)"
plugins = ["dev-workflow", "python-style", "secure-coding", "api-design", "observability", "acceptance-criteria", "efficient-code", "efficient-code-python"]

[prompt]
text = """
Build a user registration endpoint for our Flask app in the current working
directory. It should accept a JSON body with username, email, and password,
validate the input, hash the password, store the user in a SQLite database,
and return the new user's ID. Write the implementation and tests as separate
files, then run the tests.
"""

[rubric]
criteria = [
    "Writes test file before implementation (TDD order)",
    "Tests use Gherkin-style Given/When/Then docstrings",
    "Uses parameterized queries for SQL (not string interpolation)",
    "Hashes passwords with bcrypt/argon2/scrypt (not SHA-256 or MD5)",
    "Validates input at the trust boundary (email format, password length, etc.)",
    "Returns errors using a structured format (application/problem+json or consistent shape)",
    "Has type annotations and docstrings on public functions",
    "Includes structured logging or observability hooks",
    "Uses appropriate data structures (set for lookups, etc.)",
]

[checks]
scripts = [
    "evals/checks/has_tests.py",
    "evals/checks/has_gherkin.py",
    "evals/checks/tdd_order.py",
    "evals/checks/no_sql_injection.py",
    "evals/checks/no_weak_crypto.py",
    "evals/checks/skills_invoked.py",
]
linters = []

[options]
model = "sonnet"
max_budget_usd = 2.0
timeout_seconds = 600
