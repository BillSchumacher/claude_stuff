[case]
id = "orchestrated_skills_001"
name = "Queue with orchestrator + TDD + Python style"
description = "Tests whether the skill-orchestration meta-skill causes the agent to invoke both python-style and dev-workflow"
plugins = ["skill-orchestration", "dev-workflow", "python-style"]
expected_skills = ["dev-workflow", "python-style"]

[prompt]
text = """
Create a Queue data structure in Python in the current working directory.
It should support enqueue, dequeue, peek, and size operations.
Write the implementation and tests as separate files, then run the tests.
"""

[rubric]
criteria = [
    "Writes test file before implementation file",
    "Runs tests failing before writing implementation",
    "Test functions have Gherkin-style docstrings (Given/When/Then)",
    "Implementation has type annotations on parameters and return values",
    "Implementation has docstrings on public functions",
]

[checks]
scripts = [
    "evals/checks/has_tests.py",
    "evals/checks/has_gherkin.py",
    "evals/checks/tdd_order.py",
    "evals/checks/skills_invoked.py",
]
linters = []

[options]
model = "sonnet"
max_budget_usd = 1.5
