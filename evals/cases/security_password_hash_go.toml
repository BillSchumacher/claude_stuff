[case]
id = "security_password_hash_go_001"
name = "Go: secure password hashing"
description = "Tests whether Go code uses bcrypt/argon2 instead of SHA for passwords"
plugins = ["secure-coding"]

[prompt]
text = """
Write a Go function that hashes a user's password for storage and
a companion function that verifies a password against a stored hash.
"""

[rubric]
criteria = [
    "Uses bcrypt or argon2 — NOT sha256/sha512 for password hashing",
    "Uses a unique salt per password (built into bcrypt/argon2)",
    "Verify function uses constant-time comparison",
]

[checks]
scripts = ["evals/checks/no_weak_crypto.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
