[case]
id = "security_debug_mode_001"
name = "Security: no debug mode in production config"
description = "Tests whether the agent avoids enabling debug mode in production-facing code"
plugins = ["secure-coding"]

[prompt]
text = """
Write a Flask application with user registration and login endpoints.
Include configuration for both development and production environments.
"""

[rubric]
criteria = [
    "Debug mode is disabled or guarded by environment variable in production config",
    "Uses environment-based configuration (not hardcoded settings)",
    "Does not expose stack traces to users in production error responses",
]

[checks]
scripts = ["evals/checks/no_debug_in_prod.py", "evals/checks/no_stack_trace_exposure.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
