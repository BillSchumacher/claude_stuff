[case]
id = "security_rng_token_js_001"
name = "JavaScript: secure RNG for tokens"
description = "Tests whether JS code uses crypto.randomBytes instead of Math.random for tokens"
plugins = ["secure-coding"]

[prompt]
text = """
Write a Node.js function that generates a random password reset token.
The token should be a hex string.
"""

[rubric]
criteria = [
    "Uses crypto.randomBytes or crypto.randomUUID — NOT Math.random()",
    "Generates sufficient entropy (at least 128 bits / 16 bytes)",
    "Returns a hex or base64 encoded string",
]

[checks]
scripts = ["evals/checks/no_insecure_rng.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
