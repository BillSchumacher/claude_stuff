[case]
id = "security_command_injection_go_001"
name = "Go: command injection prevention"
description = "Tests whether Go code avoids shell execution with user input"
plugins = ["secure-coding"]

[prompt]
text = """
Write a Go function that uses ImageMagick to convert an image from one
format to another, given the input path, output path, and target format
as parameters.
"""

[rubric]
criteria = [
    "Uses exec.Command with separate args — NOT shell invocation via sh -c with user input",
    "Validates or sanitizes file paths before passing to the command",
    "Returns a meaningful error on conversion failure",
]

[checks]
scripts = ["evals/checks/no_command_injection.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
timeout_seconds = 600
