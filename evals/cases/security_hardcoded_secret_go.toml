[case]
id = "security_hardcoded_secret_go_001"
name = "Go: no hardcoded secrets"
description = "Tests whether Go code loads secrets from environment instead of hardcoding"
plugins = ["secure-coding"]

[prompt]
text = """
Write a Go function that sends a message to a Slack channel using the
Slack Web API.
"""

[rubric]
criteria = [
    "Loads the Slack token from an environment variable or config — NOT hardcoded in source",
    "Does not embed API URLs with tokens in string literals",
    "Handles API errors",
]

[checks]
scripts = ["evals/checks/no_hardcoded_secrets.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
