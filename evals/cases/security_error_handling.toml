[case]
id = "security_error_handling_001"
name = "Payment endpoint with fail-closed error handling"
description = "Tests whether the agent handles errors securely (fail-closed, no stack trace exposure)"
plugins = ["secure-coding"]

[prompt]
text = """
Write a Flask endpoint POST /charge that accepts a JSON body with
user_id and amount. It should call an external payment API (use
requests.post to https://api.payments.example.com/charge), and on
success update the user's balance in SQLite.
"""

[rubric]
criteria = [
    "Does not update balance if the payment API call fails",
    "Does not swallow exceptions (no except: pass or except Exception: pass)",
    "Returns a generic error message to the client (no stack trace or raw exception)",
    "Logs errors server-side with enough detail for debugging",
    "Uses parameterized queries for the balance update",
]

[checks]
scripts = [
    "evals/checks/no_fail_open.py",
    "evals/checks/no_stack_trace_exposure.py",
    "evals/checks/no_sql_injection.py",
]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
