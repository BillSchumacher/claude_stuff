[case]
id = "security_password_hash_php_001"
name = "PHP: secure password hashing"
description = "Tests whether PHP code uses password_hash instead of md5/sha1"
plugins = ["secure-coding"]

[prompt]
text = """
Write PHP functions to hash a user's password for storage and to
verify a password against a stored hash.
"""

[rubric]
criteria = [
    "Uses password_hash/password_verify — NOT md5() or sha1() for passwords",
    "Uses PASSWORD_BCRYPT or PASSWORD_ARGON2ID algorithm",
    "Does not use a fixed or missing salt (password_hash auto-generates)",
]

[checks]
scripts = ["evals/checks/no_weak_crypto.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
