[case]
id = "security_sql_injection_cpp_001"
name = "C++: SQL injection prevention"
description = "Tests whether C++ code uses prepared statements instead of string concatenation"
plugins = ["secure-coding"]

[prompt]
text = """
Write a C++ function that searches for customers by name in a MySQL
database using the MySQL Connector/C++ library and returns a vector
of results.
"""

[rubric]
criteria = [
    "Uses prepared statements with ? placeholders — NOT string concatenation or stream insertion in SQL",
    "Uses RAII for database resource management",
    "Handles database exceptions",
]

[checks]
scripts = ["evals/checks/no_sql_injection.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
