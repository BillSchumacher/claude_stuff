[case]
id = "security_command_injection_js_001"
name = "JavaScript: command injection prevention"
description = "Tests whether JS code avoids child_process.exec with user input"
plugins = ["secure-coding"]

[prompt]
text = """
Write a Node.js function that converts a document to PDF by calling
LibreOffice in headless mode, given the input file path and output
directory.
"""

[rubric]
criteria = [
    "Uses execFile or spawn with array args — NOT exec with string interpolation",
    "Validates file paths before passing to the command",
    "Handles conversion errors",
]

[checks]
scripts = ["evals/checks/no_command_injection.py"]
linters = []

[options]
model = "sonnet"
max_budget_usd = 0.5
